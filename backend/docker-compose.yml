# Flutter app -> nginx (:8080) -> api -> Supabase (online PostgreSQL)
# Start:  docker compose up --build
# DATABASE_URL comes from backend/.env (your Supabase Session pooler address).
services:
  api:
    build: .
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api