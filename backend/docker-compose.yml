# Use this instead of docker-compose.yml when the database is Supabase (online).
# The normal docker-compose.yml always starts its OWN local PostgreSQL and
# overrides DATABASE_URL, so your Supabase address in .env would be ignored.
#
# Start:  docker compose -f docker-compose.supabase.yml up --build
services:
  api:
    build: .
    env_file: .env          # DATABASE_URL comes from here (Supabase)
    environment:
      TRUST_PROXY: "1"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
